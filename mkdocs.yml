site_name: Dxworks Insider

theme:
  name: material
  features:
    - content.code.copy

  palette:
    # Toggle light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Toggle dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

extra_css:
  - stylesheets/dxworks-theme.css

nav:
  - Home: 'index.md'
  - 'Installation': 'queryLanguage.md'
  - 'Configuration':
      - 'config/config.md'
      - 'Languages': 'config/languages.md'
      - 'Ignore Files': 'config/ignore.md'
      - 'Fingerprints': 'config/fingerprints.md'
      - 'Insider Config': 'config/insider.md'
  - 'Commands':
      - 'Detect': 'commands/detect.md'
      - 'Find': 'commands/find.md'
      - 'Inspect': 'commands/inspect.md'
