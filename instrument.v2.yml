name: insider
id: insider
version: 1.0.0

actions:
  verify:
    with:
      requirements:
        - name: Java 21+
          min: 21.0.0
          command: java -version
          match:
            - 'version "(?<version>.+)"'
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    parameters:
      max-heap: 8g
      findConfig: 'config/fingerprints/code_smells.json config/fingerprints/libraries.json config/fingerprints/generated_code.json'
      inspectConfig: 'config/rules'
    environment:
      INSIDER_PROJECTID: ${repoName}
      INSIDER_ROOTFOLDER: ${repo}
      INSIDER_LANGUAGES: ''
      INSIDER_LINGUIST_FILE: ${instrumentPath}/languages.yml
    commands:
      insider-run-all:
        id: insider-run-all
        dir: ${instrumentPath}
        command: >-
          java -Xmx${max-heap} -jar insider.jar detect AND indent AND extract AND measure AND inspect ${inspectConfig} AND find ${findConfig}
      insider-cloc:
        id: insider-cloc
        dir: ${instrumentPath}
        command: >-
          java -Xmx${max-heap} -jar insider.jar count

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Technology Breakdown
    environment:
      INSIDER_LINGUIST_FILE: ${instrumentPath}/languages.yml
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 insider-summary.py "${instrumentPath}/results") else (python insider-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 insider-summary.py "${instrumentPath}/results"; else python insider-summary.py "${instrumentPath}/results"; fi

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
