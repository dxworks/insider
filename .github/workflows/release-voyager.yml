on:
  push:
    tags:
      - 'v*-voyager'

name: Release Voyager

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "semver=${TAG%-voyager}" >> $GITHUB_OUTPUT

  gate:
    needs: [parse-tag]
    uses: dxworks/pipelines/.github/workflows/release-gate.yml@v1
    with:
      java-version: '21'
    permissions:
      contents: read
      security-events: write

  archive:
    needs: [gate, parse-tag]
    uses: dxworks/pipelines/.github/workflows/release-archive.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      java-version: '21'
      prepare-script: ./scripts/prepare-release-voyager.sh
    permissions:
      contents: read

  github-release:
    needs: [parse-tag, archive]
    uses: dxworks/pipelines/.github/workflows/release-github.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      tag: ${{ github.ref_name }}
      release-name: Insider ${{ needs.parse-tag.outputs.semver }} Voyager
      asset-name: insider-voyager.zip
    permissions:
      contents: write
