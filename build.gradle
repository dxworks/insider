plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.2.0'
}

group 'org.dxworks'
version '2.6.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name 'ossrh'
        url 'https://s01.oss.sonatype.org/content/repositories/snapshots'
    }
}

dependencies {

    //command line runner
    implementation group: 'info.picocli', name: 'picocli', version: '4.7.7'

    implementation group: 'me.tongfei', name: 'progressbar', version: '0.10.2'

    //data format parsers
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.21.0'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'


    implementation group: 'commons-io', name: 'commons-io', version: '2.21.0'
    implementation 'commons-lang:commons-lang:2.6'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'

    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.26'

    implementation 'org.dxworks:dx-ignore:1.1.0-SNAPSHOT'
    implementation 'org.dxworks:argumenthor:1.1.0-SNAPSHOT'
    implementation 'org.dxworks:dx-linguist:1.0.0-SNAPSHOT'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "org.dxworks.insider.Insider"
    }

    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
